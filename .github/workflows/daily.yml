name: Bloxd.io Daily Video Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      keyword:
        description: "Optional keyword override; leave empty to use config.yml bloxd.io keywords"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Search, select, download, and prepare upload command only"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: yt-bili-authorized-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Setup Node for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install uploader CLI
        run: |
          python -m pip install biliup

      - name: Restore Bilibili login file
        env:
          BILIUP_COOKIE_JSON: ${{ secrets.BILIUP_COOKIE_JSON }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          if [ -z "$BILIUP_COOKIE_JSON" ] && [ "$DRY_RUN" != "true" ]; then
            echo "BILIUP_COOKIE_JSON is required"
            exit 1
          fi
          if [ -n "$BILIUP_COOKIE_JSON" ]; then
            printf '%s' "$BILIUP_COOKIE_JSON" > cookies.json
          fi

      - name: Restore optional YouTube login file
        env:
          YOUTUBE_COOKIES_TXT: ${{ secrets.YOUTUBE_COOKIES_TXT }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 -d > youtube-cookies.txt
          elif [ -n "$YOUTUBE_COOKIES_TXT" ]; then
            printf '%s' "$YOUTUBE_COOKIES_TXT" > youtube-cookies.txt
          fi

      - name: Validate YouTube login file
        run: python scripts/validate_youtube_cookies.py

      - name: Search candidates
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OVERRIDE_KEYWORD: ${{ inputs.keyword }}
        run: python scripts/search.py

      - name: Select candidate
        run: python scripts/choose.py

      - name: Download media
        run: python scripts/download.py

      - name: Upload to Bilibili
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python scripts/upload.py

      - name: Update posted state
        if: ${{ inputs.dry_run != 'true' }}
        run: python scripts/update_state.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-state
          path: |
            data/candidates.json
            data/selected.json
            data/upload-result.json
            logs/latest.json
          if-no-files-found: ignore

      - name: Commit state
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/posted.json data/download-archive.txt
          git commit -m "update sync state" || exit 0
          git push
