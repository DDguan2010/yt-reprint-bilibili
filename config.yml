bilibili:
  # Bilibili partition id. 17 is commonly used for stand-alone games.
  # Change it if your target account uses another game-related partition.
  tid: 17
  # 2 means repost. Keep the original source URL in source/description.
  copyright: 2
  no_reprint: 1
  title_template: "{title}"
  desc_template: |
    原视频链接：{url}
    原作者：{channel}
    原发布时间：{upload_date}
    搜索关键词：{keyword}

    本内容用于 bloxd.io 游戏视频同步展示，请遵守原作者许可与平台规则。
  default_tags:
    - bloxd.io
    - Bloxd
    - 网页游戏
    - 沙盒游戏
    - 游戏视频
  # The default uploader is the biliup CLI. If the CLI changes, adjust this
  # template without editing scripts. Available placeholders:
  # {cookie_file}, {video_file}, {title}, {desc}, {source}, {tid}, {tags}, {cover_file}
  upload_command_template: >-
    biliup -u {cookie_file} upload {video_file}
    --submit web
    --copyright {copyright}
    --source {source}
    --tid {tid}
    --title {title}
    --desc {desc}
    --tag {tags}
    {cover_arg}

search:
  max_uploads_per_run: 1
  max_candidates_per_keyword: 25
  keywords:
    - "bloxd.io"
    - "bloxd"
    - "bloxd.io latest"
    - "bloxd.io new"
    - "bloxd.io gameplay"
    - "bloxd io"

filters:
  min_duration_seconds: 60
  max_duration_seconds: 2400
  min_view_count: 0
  published_within_days: 30
  # Only YouTube Data API exposes license reliably. yt-dlp search fallback may
  # not return license metadata, so CC filtering can skip otherwise valid videos.
  require_creative_commons: false
  blocked_words: []
  channel_allowlist: []
  channel_blocklist: []

download:
  max_attempts_per_run: 10
  preferred_method: ytdown
  ytdown_api_url: "https://app.ytdown.to/proxy.php"
  ytdown_worker_timeout_seconds: 90
  ytdown_proxy_retries: 3
  js_runtimes: node
  remote_components: ejs:npm
  extractor_args: "youtube:player_client=tv,web"
  # Download the best available video and audio, then merge with ffmpeg.
  format: "bv*+ba/b"
  subtitle_languages:
    - en
    - zh-Hans
  write_thumbnail: true
  merge_output_format: mp4

runtime:
  work_dir: downloads
  cookie_file: cookies.json
  youtube_cookie_file: youtube-cookies.txt
  youtube_cookie_probe_url: "https://www.youtube.com/watch?v=sV-Z1LrR6MU"
  candidates_file: data/candidates.json
  selected_file: data/selected.json
  posted_file: data/posted.json
  archive_file: data/download-archive.txt
  latest_log_file: logs/latest.json
  upload_result_file: data/upload-result.json
